name: Build APK

on:
  push:
    branches: [v2.0-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 pillow

      - name: Set app icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          cp icon.png assets/splash.png

      - name: Build APK
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: photo-meta-apk
          path: build/apk/*.apk
          if-no-files-found: error
