[project]
name = "photometa"
version = "1.0.0"
description = "Photo metadata viewer"
requires-python = ">=3.9"
dependencies = [
  "flet==0.28.3",
  "pillow"
]

[tool.flet]
product = "Photo Meta"
org = "com.kaushal.photometa"
company = "Kaushal"

[tool.flet.android]
min_sdk_version = 24

[tool.flet.splash]
color = "#0B0B14"
dark_color = "#0B0B14"

[tool.flet.app.boot_screen]
show = true
message = "Preparing Photo Meta..."

[tool.flet.app.startup_screen]
show = true
message = "Starting..."